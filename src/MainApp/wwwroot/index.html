<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Installer.Net</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8f9fa; }
        .card { width: 100%; max-width: 480px; padding: 2rem; }
        .form-control:focus { border-color: #667eea; box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.25); }
        .btn-primary { width: 100%; padding: 0.75rem; background: #667eea; border-color: #667eea; }
        .btn-primary:hover { background: #5a67d8; border-color: #5a67d8; }
    </style>
</head>
<body>
    <div class="card">
        <h3 class="text-center mb-3">Installer.Net</h3>
        <p class="text-center text-muted mb-4">Database configuration required for installation</p>
        
        <form id="installerForm">
            <div class="mb-3">
                <label class="form-label">Database Provider</label>
                <select class="form-select" id="provider" name="provider" required>
                    <option value="PostgreSQL" selected>PostgreSQL</option>
                    <option value="SqlServer">Sql Server</option>
                    <option value="MySQL">MySQL</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Connection String</label>
                <input type="text" class="form-control" id="connectionString" name="connectionString" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                <label class="form-check-label" for="remember">Remember this configuration</label>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Install & Continue</button>
        </form>
        
        <div id="status" class="mt-3 d-none"></div>
    </div>

    <script>
        // Load default connection string from data attribute
        const defaultConnStr = document.getElementById('installerForm').dataset.defaultConnectionString || '';
        if (defaultConnStr) {
            document.getElementById('connectionString').value = defaultConnStr;
        }

        const form = document.getElementById('installerForm');
        const statusDiv = document.getElementById('status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            
            statusDiv.removeAttribute('class');
            statusDiv.className = 'd-block text-center mb-3';
            statusDiv.innerHTML = '<div class="spinner-border text-primary" role="status"></div> Processing...';
            statusDiv.style.color = '#667eea';

            try {
                const response = await fetch('/api/installer', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (response.ok) {
                    statusDiv.innerHTML = `<div class="alert alert-success"> ${result.message}</div>`;
                    statusDiv.style.color = '#28a745';
                    setTimeout(() => {
                        if (result.redirect) {
                            window.location.href = result.redirect;
                        }
                    }, 2000);
                } else {
                    statusDiv.innerHTML = `<div class="alert alert-danger"> ${result.error || 'Installation failed'}</div>`;
                    statusDiv.style.color = '#dc3545';
                }
            } catch (err) {
                statusDiv.innerHTML = `<div class="alert alert-danger">Request failed: ${err.message}</div>`;
                statusDiv.style.color = '#dc3545';
            }
        });
    </script>
</body>
</html>
